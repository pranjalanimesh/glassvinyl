# Builds GlassVinyl.app and publishes it as a GitHub Release when a version tag is pushed:
#   git tag v0.2.0 && git push origin v0.2.0
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5

      - name: Build
        run: VERSION="${GITHUB_REF_NAME#v}" ./build.sh --zip

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/GlassVinyl.zip \
            --title "GlassVinyl ${GITHUB_REF_NAME#v}" \
            --generate-notes
